<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      margin: 0;
      background: #fafafa;
      color: #333;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 14px;
      color: #222;
    }
    .input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    input:focus {
      border-color: #1F90FF;
    }
    button.add-btn {
      padding: 6px 12px;
      background: #1F90FF;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    button.add-btn:hover {
      background: #1877d5;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 220px;
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      font-size: 13px;
      border-bottom: 1px solid #f0f0f0;
    }
    li:last-child {
      border-bottom: none;
    }
    .del-btn {
      color: #999;
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 0 4px;
    }
    .del-btn:hover {
      color: #e53935;
    }
    .empty-msg {
      color: #888;
      font-size: 12px;
      text-align: center;
      padding: 12px;
    }
  </style>
</head>
<body>
  <h3>B-guru フィルター設定</h3>
  <div class="input-group">
    <input type="text" id="wordInput" placeholder="非表示にするワード">
    <button class="add-btn" id="addBtn">追加</button>
  </div>
  <ul id="wordList"></ul>
  <script src="popup.js"></script>
</body>
</html>
